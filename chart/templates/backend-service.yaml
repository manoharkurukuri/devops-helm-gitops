apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullstack.fullname" . }}-backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.backend.healthPath | quote }}
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  type: NodePort
  selector:
    app: {{ include "fullstack.fullname" . }}-backend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: http
      nodePort: {{ .Values.backend.service.nodePort }}
