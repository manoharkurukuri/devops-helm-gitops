# UPDATE both repository URLs using outputs from the Terraform repository.
# Frontend and backend builds are expected to provide ports and routes below.
frontend:
  replicaCount: 1
  containerPort: 3000
  service:
    port: 80
    nodePort: 30080
  healthPath: /
  image:
    repository: "317876758969.dkr.ecr.us-east-1.amazonaws.com/devops-frontend"
    tag: "bootstrap"
    pullPolicy: IfNotPresent
  env:
    # Dummy URL: replace with the browser-accessible backend URL before using API features.
    API_URL: "http://k8s-devopsshared-1bc2f88bf9-2109907366.us-east-1.elb.amazonaws.com/api/auth"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

backend:
  replicaCount: 1
  containerPort: 8080
  service:
    port: 8080
    nodePort: 30081
  healthPath: /api/auth/server-status
  image:
    repository: "317876758969.dkr.ecr.us-east-1.amazonaws.com/devops-backend"
    tag: "bootstrap"
    pullPolicy: IfNotPresent
  existingSecret: backend-secret
  env:
    SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "true"
    SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
    SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration"
    SERVER_FORWARD_HEADERS_STRATEGY: "NONE"
    JWT_EXPIRATION: "60400000"
    CLERK_ISSUER: "https://stable-magpie-16.clerk.accounts.dev"
    CLERK_JWKS_URL: "https://stable-magpie-16.clerk.accounts.dev/.well-known/jwks.json"
  resources:
    requests:
      cpu: 250m
      memory: 320Mi
    limits:
      cpu: 500m
      memory: 1Gi

ingress:
  enabled: true
  groupName: devops-shared
